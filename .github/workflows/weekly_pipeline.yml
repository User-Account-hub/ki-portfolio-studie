name: Weekly Portfolio Pipeline

on:
  schedule:
    # Jeden Montag UND Donnerstag, 15:00 UTC - bewusst innerhalb der reguraeren NYSE-Handelszeit
    # (9:30-16:00 ET) unabhaengig von der US-Sommerzeit: 9:30-16:00 ET entspricht
    # 13:30-20:00 UTC waehrend EDT (Maerz-November) bzw. 14:30-21:00 UTC waehrend
    # EST (November-Maerz); 15:00 UTC liegt sicher in beiden Faellen mitten in der
    # Handelszeit. GitHub Actions cron folgt nicht der US-Sommerzeit, daher fixe
    # UTC-Uhrzeit statt "Marktzeit" direkt planbar.
    #
    # Vorherige Zeit war 07:00 UTC (= 09:00-09:19 Schweizer Zeit je nach Sommer-/
    # Winterzeit) - das lag IMMER vor Boersenoeffnung. Da Market-Orders ausserhalb
    # der Handelszeit nicht fuellen koennen (Alpaca queued sie bestenfalls fuer die
    # naechste Session), fuehrte das dazu, dass saemtliche Trades im 2026-09-07-Lauf
    # als "nicht ausgefuehrt" uebersprungen wurden - kein Bug im Code, sondern
    # falsch getimter Trigger.
    #
    # 2026-09-08 bis 2026-09-10: zweimal woechentlich (Montag + Donnerstag),
    # jeweils 15:00 UTC.
    #
    # Seit 2026-09-10: Regimewechsel auf taeglichen Handel (Mo-Fr), siehe
    # Thesis Kap. 6.3/11.2/15 (Phase 1 -> Phase 2). src/metrics.py
    # rekonstruiert den NAV-Verlauf entsprechend phasenabhaengig: vor
    # PHASE2_START weiterhin Mo/Do-Checkpoints, ab PHASE2_START taeglich
    # (siehe reconstruct_nav_history's `phase2_start`-Parameter und
    # compute_metrics' PHASE2_PERIODS_PER_YEAR) - beide Stellen (Cron hier und
    # PHASE2_START/`freqs` in src/metrics.py) muessen bei einer weiteren
    # Frequenzaenderung zusammen angepasst werden.
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-portfolio-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database (idempotent)
        env:
          DB_PATH: ${{ vars.DB_PATH || './db/portfolio.db' }}
          PORTFOLIO_NAME: ${{ vars.PORTFOLIO_NAME || 'ki-fallstudie-1' }}
          INITIAL_CASH_BALANCE: ${{ vars.INITIAL_CASH_BALANCE || '100000' }}
          PORTFOLIO_CURRENCY: ${{ vars.PORTFOLIO_CURRENCY || 'USD' }}
          BENCHMARK_SYMBOL: ${{ vars.BENCHMARK_SYMBOL || 'SPY' }}
        run: python db/init_db.py

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: ${{ vars.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets' }}
          DB_PATH: ${{ vars.DB_PATH || './db/portfolio.db' }}
          PORTFOLIO_NAME: ${{ vars.PORTFOLIO_NAME || 'ki-fallstudie-1' }}
          WATCHLIST_PATH: ${{ vars.WATCHLIST_PATH || './config/watchlist.yaml' }}
          RISK_CONFIG_PATH: ${{ vars.RISK_CONFIG_PATH || './config/risk_config.yaml' }}
          REPORTS_DIR: ${{ vars.REPORTS_DIR || './reports' }}
          RISK_FREE_RATE_ANNUAL: ${{ vars.RISK_FREE_RATE_ANNUAL || '0.04' }}
        run: python -m src.pipeline

      - name: Upload report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-report-${{ github.run_id }}
          path: reports/*.md
          if-no-files-found: warn

      - name: Commit updated DB and report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db/*.db reports/*.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen zum Committen."
            exit 0
          fi

          git commit -m "chore: weekly pipeline run $(date -u +%Y-%m-%d)"

          # Zwischen Checkout (Job-Start) und diesem Push kann der Remote-
          # Branch weitergelaufen sein (z.B. ein manueller Push waehrend der
          # Lauf noch aktiv war) - das fuehrte in Lauf #5 zu einem
          # non-fast-forward-Fehlschlag, der den ganzen Job scheitern liess,
          # obwohl Report/DB laengst fertig waren. Bei Ablehnung: Remote-Stand
          # per rebase holen und erneut versuchen, statt sofort aufzugeben.
          max_attempts=5
          attempt=1
          while true; do
            if git push; then
              echo "Push erfolgreich (Versuch $attempt/$max_attempts)."
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Push nach $max_attempts Versuchen weiterhin fehlgeschlagen."
              exit 1
            fi
            echo "Push abgelehnt (Versuch $attempt/$max_attempts) - hole Remote-Stand per 'git pull --rebase' und versuche erneut..."
            if ! git pull --rebase origin master; then
              echo "::error::git pull --rebase konnte nicht sauber angewendet werden (echter Konflikt, z.B. gleichzeitige Aenderung an db/portfolio.db) - breche ab, statt einen inkonsistenten Merge zu committen. Bitte manuell pruefen."
              git rebase --abort || true
              exit 1
            fi
            attempt=$((attempt + 1))
          done
