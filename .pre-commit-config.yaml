# Verhindert versehentliche Secret-Commits (API-Keys, Tokens, etc.).
# detect-secrets statt gitleaks: reines Python, laeuft ueber `pre-commit`
# ohne zusaetzliche Toolchain (gitleaks' offizieller pre-commit-Hook
# braucht Go, das hier nicht installiert ist).
#
# Einrichtung (einmalig pro Entwickler-Checkout):
#   pip install pre-commit
#   pre-commit install
#
# Ein echter Fund blockiert den Commit. Ein bekannter False-Positive wird
# per `detect-secrets scan --baseline .secrets.baseline` neu erzeugt und
# mitcommittet, NICHT per --no-verify umgangen.
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: package.lock.json
