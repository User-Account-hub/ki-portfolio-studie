# Risk-Guardrails - siehe src/risk_guardrails.py für die Durchsetzung.
# Diese Werte sind KEINE Empfehlungen an Claude, sondern harte,
# vom Code erzwungene Limits (defense in depth: der Prompt nennt
# Claude dieselben Regeln, aber die Ausführung verlässt sich nicht
# darauf, dass das Modell sie einhält).

# Max. Anteil eines Einzeltitels (long oder short, nach Ausführung
# des Trades) am gesamten Portfolio-NAV.
max_position_size_pct_of_portfolio: 0.10

# Max. Volumen (Notional) eines einzelnen Trades als Anteil des NAV zu
# Laufbeginn (fixe Bezugsgrösse fuer den ganzen Lauf, konsistent mit den
# Kap.-6.8-Guardrails unten) - NICHT des sich laufend aendernden Cash, das
# mit jedem ausgefuehrten Buy schrumpfen wuerde und das Limit sonst von
# Order zu Order verschaerft haette.
max_trade_notional_pct_of_nav: 0.05

# Verlustgrenze seit dem Start des aktuellen Pipeline-Laufs
# ("Tagesverlust" im Sinne des Runs, nicht des Kalendertags, da der Cron
# mehrmals woechentlich laeuft, aktuell Montag+Donnerstag).
# Wird sie unterschritten, werden KEINE neuen Positionen mehr eröffnet
# oder aufgestockt - Pflicht-Stop-Loss-Schließungen (siehe unten)
# sind davon ausgenommen.
daily_loss_stop_pct: -0.03

# Max. Anzahl Trades pro Symbol und Kalendertag.
max_trades_per_symbol_per_day: 1

# Long- und Short-Positionen auf Aktien/ETFs des Universums erlaubt.
allow_short: true

# Strukturierte Produkte (Hebelzertifikate, Mini-Futures, Optionsscheine)
# auf Titel des Universums erlaubt (werden simuliert ausgeführt, siehe README).
allow_structured_products: true

# Summe der Notionals aller offenen strukturierten Produkte darf diesen
# Anteil des Portfolio-NAV nicht überschreiten.
structured_products_max_notional_pct_of_nav: 0.20

# Stop-Loss für Short-Positionen: Schwelle für die Kursbewegung GEGEN
# die Position (Kurs steigt) relativ zum Einstandskurs. -0.20 bedeutet:
# Zwangsschliessung, sobald der Kurs 20% über dem Einstandskurs liegt.
short_stop_loss_pct: -0.20

# Kein klassisches Margin-Trading: Käufe/Shorts dürfen das vorhandene
# Cash nicht überschreiten (keine gehebelte Kaufkraft über 1x Cash hinaus).
allow_margin: false

# --- Kap. 6.8 Thesis: zusätzliche Portfolio-Leitplanken ---
# Alle Prozentwerte beziehen sich auf den NAV, ausser wo anders vermerkt.
# Durchsetzung: src/risk_guardrails.py (check_segment_weight,
# check_correlated_segment_exposure, check_micro_cap_exposure,
# check_top3_concentration, check_min_cash_quota, check_circuit_breaker).

# Max. Anteil eines einzelnen Segments (Anhang-A-Taxonomie, z.B.
# "KI-Halbleiter & Compute") am NAV nach Ausführung des Trades.
max_segment_weight_pct_of_nav: 0.30

# Segmente, deren kombinierte Exposure zusätzlich durch
# max_correlated_crypto_mining_pct_of_nav begrenzt wird (Krypto-Mining und
# Digital-Asset-Titel korrelieren stark mit dem Bitcoin-/Krypto-Kurs).
correlated_crypto_mining_segments:
  - "Krypto-Mining"
  - "Digital Assets & Krypto-Oekosystem"
max_correlated_crypto_mining_pct_of_nav: 0.30

# Max. Anteil von Micro-Cap-Titeln (CapTier enthält "Micro", deckt auch
# Mischformen wie "Micro/Small-Cap" ab) am NAV.
max_micro_cap_pct_of_nav: 0.15

# Max. kombinierter Anteil der drei grössten Einzelpositionen (nach
# Marktwert) am NAV.
max_top3_concentration_pct_of_nav: 0.35

# Mindest-Cash-Quote am NAV, die durch einen cash-verbrauchenden Trade
# (buy/cover) nicht unterschritten werden darf.
min_cash_pct_of_nav: 0.05

# Circuit-Breaker: Drawdown seit dem bisherigen NAV-Höchststand, ab dem
# keine neuen/aufstockenden Hebelpositionen (strukturierte Produkte) mehr
# eröffnet werden dürfen. Negativer Wert, analog zu daily_loss_stop_pct.
# Dient gleichzeitig als Voll-Stop-Schwelle der Drawdown-Positionsgrössen-
# Stufen unten (dort für ALLE Titel, hier nur für Hebelpositionen).
circuit_breaker_drawdown_pct: -0.25

# Abgestufter Drawdown-Schutz für die max. Einzelpositionsgrösse
# (max_position_size_pct_of_portfolio oben), zusätzlich zum harten
# Circuit-Breaker oben: siehe risk_guardrails.drawdown_position_size_factor.
# Reduziert die maximal erlaubte NEUE/aufstockende Positionsgrösse abgestuft,
# je tiefer der Drawdown seit dem historischen NAV-Höchststand
# (db.get_peak_nav - dieselbe Infrastruktur wie beim Circuit-Breaker oben)
# bereits gefallen ist. Gilt AUSDRÜCKLICH NICHT für Hebelpositionen/
# strukturierte Produkte - deren Verhalten bleibt unverändert exklusiv
# durch circuit_breaker_drawdown_pct oben geregelt (harter Stop einzig bei
# -25%, keine Zwischenstufen).
# Stufe 1: ab -10% Drawdown auf 75% der sonst erlaubten Positionsgrösse.
drawdown_tier1_pct: -0.10
drawdown_tier1_position_size_factor: 0.75
# Stufe 2: ab -15% Drawdown auf 50% der sonst erlaubten Positionsgrösse.
drawdown_tier2_pct: -0.15
drawdown_tier2_position_size_factor: 0.50
# Stufe 3 (kompletter Stop neuer/aufstockender Positionen, auch für
# Nicht-Hebeltitel) nutzt bewusst dieselbe Schwelle wie circuit_breaker_
# drawdown_pct oben (-25%) statt eines weiteren eigenen Werts - "wie
# bisher" bezogen auf denselben Drawdown-Punkt, an dem bereits der
# Hebel-Circuit-Breaker greift.

# Feste Kosten-Annahme pro Trade (Spread/Slippage-Pauschale, 2026-09-17):
# wird bei JEDER Order-Ausführung tatsächlich vom Cash abgezogen (siehe
# execution.py), nicht nur als Limitation im README erwähnt. Gilt für beide
# Richtungen (Kauf/Short UND Verkauf/Cover) - ein Spread kostet unabhängig
# von der Handelsrichtung. 0.001 = 0.1% des Notional-Betrags je Trade.
transaction_cost_pct_of_notional: 0.001

# --- Volatilitätsadjustierte Positionsgrössen-Skalierung (2026-09-19) ---
# Skaliert die von Claude vorgeschlagene Grösse einer positionsaufbauenden
# Order (buy/short) VOR der Guardrail-Prüfung oben mit
# Universums-Ø-Volatilität / Symbol-Volatilität (rollierende 20-Tage-
# annualisierte Volatilität, siehe src/position_sizing.py und
# data_fetch.MarketSnapshot.volatility_20d_annualized). Nur eine
# Verfeinerung INNERHALB der Kap.-6.8-Limiten oben - die skalierte Grösse
# durchläuft danach dieselbe Guardrail-Prüfung wie jede andere Order, kann
# also keines der obigen Limits aushebeln.
# Untergrenze des Skalierungsfaktors (stark überdurchschnittlich volatile
# Titel werden nie staerker als auf diesen Faktor verkleinert).
volatility_scaling_min_factor: 0.5
# Obergrenze des Skalierungsfaktors (stark unterdurchschnittlich volatile
# Titel werden nie staerker als auf diesen Faktor vergroessert).
volatility_scaling_max_factor: 1.5

# --- Liquiditätslimit (Kap. 6.13, 2026-09-21) ---
# Eine einzelne Order (buy/short) darf nicht mehr als diesen Anteil des
# zuletzt bekannten Tagesvolumens des Titels ausmachen (siehe
# risk_guardrails.check_liquidity_limit) - schützt vor einem Ausführungs-/
# Slippage-Risiko, das die NAV-basierten Positionsgrössen-Limiten oben nicht
# abdecken: eine vom NAV her erlaubte Positionsgrösse kann das tatsächliche
# Handelsvolumen eines dünn gehandelten Titels trotzdem übersteigen.
# Nutzt MarketSnapshot.volume (data_fetch.py) - das ist das zuletzt bekannte
# EINZELTAGES-Volumen, KEIN echter mehrtägiger gleitender Durchschnitt
# (yfinance liefert hier keinen); dokumentierte Vereinfachung, für dieses
# grobe Ausführungsrisiko-Signal aber ausreichend. Fehlt das Volumen (z.B.
# Datenausfall), wird NICHT blockiert - ein Datenausfall soll nicht
# fälschlich als Liquiditätsproblem gewertet werden.
max_order_pct_of_avg_daily_volume: 0.10
